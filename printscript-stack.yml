services:
  printscript-service:
    image: ghcr.io/age-of-printscript/printscript-service:${ENV}
    ports:
      - "8082:8080"
    environment:
      - ASSET_SERVICE_URL=http://asset-service:8080
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - app-network
    env_file:
      - .env

networks:
  app-network:
      driver: overlay
